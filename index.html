const SUPABASE_URL = "https://qopinzgdnczovxyllhvi.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvcGluemdkbmN6b3Z4eWxsaHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTU1OTMsImV4cCI6MjEwODAzMTU5M30.c5gDmk0N3-07ZpiOEuhzJPBpVZm16hT0pITLibumDIg";

const H = ["Bryan/Uriel", "Ricardo", "Erick", "Carlos"];    // orden oficial
const CAP_G = 6;                                            // capacidad total de garrafones
/* El orden oficial es H. En Supabase los datos viejos se guardaron en el orden anterior (..., Carlos, Erick):
   al leer y al escribir se intercambian solo los lugares 2 y 3 (la misma función sirve en los dos sentidos). */
const sw = i => (i === 2 ? 3 : i === 3 ? 2 : i);
const swArr = a => (Array.isArray(a) && a.length === 4 ? [a[0], a[1], a[3], a[2]] : a);
function ordenDoc(id, d) {
  if (!d || typeof d !== "object") return d;
  const x = JSON.parse(JSON.stringify(d)), num = (o, k) => { if (typeof o[k] === "number") o[k] = sw(o[k]); };
  if (id === "global") ["water", "aB", "aR"].forEach(k => num(x, k));
  else if (id.startsWith("sem-")) ["boss", "swapLun", "swapJue"].forEach(k => num(x, k));
  else if (id.startsWith("mes-")) {
    num(x, "boss");
    if (x.rent) x.rent = swArr(x.rent);
    if (x.svc) Object.keys(x.svc).forEach(k => { x.svc[k] = swArr(x.svc[k]); });
    (x.rec || []).forEach(r => { if (r.paid) r.paid = swArr(r.paid); num(r, "enc"); });
    (x.shop || []).forEach(s => { if (s.paid) s.paid = swArr(s.paid); });
  } else if (id === "cuentas") {
    const a = x[2], b = x[3]; delete x[2]; delete x[3];
    if (b !== undefined) x[2] = b;
    if (a !== undefined) x[3] = a;
  } else if (id === "ausencias") (x.r || []).forEach(r => num(r, "p"));
  return x;
}
const DUENA = { n: "Sra. Rubi", b: "Banamex", c: "002027435900086068" };
const MES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const KEY = "control-casa-hist-v2";    // v2: caché en el nuevo orden de habitantes
const BTN = "bg-white shadow rounded-lg py-2 font-bold text-indigo-700";
const F4 = () => [false, false, false, false];
const arr = a => (a && a.length === 4 ? a : F4());
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const curMonth = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mod4 = n => ((n % 4) + 4) % 4;
const mIdx = m => { const [y, n] = m.split("-").map(Number); return y * 12 + n - 1; };

let DB = {}, sb = null, timer = null, writing = false, canal = null;
let viewWeek = ymd(mondayOf(new Date())), viewMonth = curMonth();
const dirty = new Set();
const $ = id => document.getElementById(id);
const setStatus = t => $("sync-status").innerText = t;

const G = () => DB.global || (DB.global = { water: 0, aW: ymd(mondayOf(new Date())), aB: 0, aM: curMonth(), aR: 0 });
function weekBoss(w) {
  const W = DB["sem-" + w]; if (W && W.boss != null) return W.boss;
  const g = G(); let bw = g.aW, bb = g.aB;
  for (const k in DB) {
    if (k.startsWith("sem-") && DB[k].boss != null) { const d = k.slice(4); if (d < w && d >= bw) { bw = d; bb = DB[k].boss; } }
  }
  return mod4(bb + Math.round((new Date(w + "T00:00") - new Date(bw + "T00:00")) / 6048e5));
}
function monthBoss(m) {
  const M = DB["mes-" + m]; if (M && M.boss != null) return M.boss;
  const g = G(); let bm = g.aM, bb = g.aR;
  for (const k in DB) {
    if (k.startsWith("mes-") && DB[k].boss != null) { const d = k.slice(4); if (d < m && d >= bm) { bm = d; bb = DB[k].boss; } }
  }
  return mod4(bb + mIdx(m) - mIdx(bm));
}

/* ---------- Basura: falta calculada con la fecha de hoy ---------- */
const addDays = (str, n) => { const d = new Date(str + "T00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysTo = d => d ? Math.round((new Date(d + "T00:00") - new Date(ymd(new Date()) + "T00:00")) / 864e5) : null;
const passed = (w, off) => ymd(new Date()) > addDays(w, off);
function missed(w, k) {
  const W = DB["sem-" + w] || {};
  return w >= G().aW && !W[k === "L" ? "basuraLun" : "basuraJue"] && passed(w, k === "L" ? 0 : 3);
}
const hoyStr = () => ymd(new Date());
/* ===== NÚCLEO DE BASURA ===== */
let SIM = null;
const rangos = () => (DB.ausencias || {}).r || [];
const away = (p, d) => rangos().some(x => x.p === p && d >= x.d1 && d <= x.d2);
function slots() {
  if (SIM) return SIM;
  const g = G(), S = {}, deudas = [], last = addDays(hoyStr(), 7 * 60);
  for (let w = g.aW; w <= last; w = addDays(w, 7)) {
    const W = DB["sem-" + w] || {}, p = addDays(w, -7), boss = weekBoss(w);
    ["L", "J"].forEach(k => {
      const date = k === "L" ? w : addDays(w, 3), sw = W[k === "L" ? "swapLun" : "swapJue"];
      let base = boss;
      if (p >= g.aW) {
        if (k === "L") base = missed(p, "L") ? S[p + "L"].o : missed(p, "J") ? S[p + "J"].o : boss;
        else base = missed(p, "L") && missed(p, "J") ? S[p + "J"].o : boss;
      }
      let o = sw != null ? sw : base;
      const s = { base, date, swap: sw != null };
      const d = sw == null ? deudas.find(x => !x.pagada && x.acreedor === o && x.date < date && !away(x.deudor, date)) : null;
      if (d) { d.pagada = date; s.repone = { acreedor: o, deudor: d.deudor }; o = d.deudor; }
      if (away(o, date)) {
        let c = mod4(o + 1), n = 0;
        while (away(c, date) && n++ < 3) c = mod4(c + 1);
        if (c !== o) { deudas.push({ deudor: o, acreedor: c, date, pagada: null }); s.cubre = { titular: o }; o = c; }
      }
      s.o = o; S[w + k] = s;
    });
  }
  return (SIM = { S, deudas });
}
const monOwner = w => { const x = slots().S[w + "L"]; return x ? x.o : weekBoss(w); };
const thuOwner = w => { const x = slots().S[w + "J"]; return x ? x.o : weekBoss(w); };
const deudaBasura = () => slots().deudas.filter(x => !x.pagada);

/* ---------- Guardado y sincronización ---------- */
const DKEY = KEY + "-dirty";
const saveDirty = () => { try { localStorage.setItem(DKEY, JSON.stringify([...dirty])); } catch (e) {} };
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
  saveDirty(); actualizarOffline();
  clearTimeout(timer); timer = setTimeout(flush, 400);
}
async function flush() {
  if (!sb || !dirty.size || !navigator.onLine) return;
  if (writing) { timer = setTimeout(flush, 400); return; }
  writing = true;
  const ids = [...dirty]; dirty.clear();
  try {
    const { error } = await sb.from("estado").upsert(ids.map(id => ({ id, data: ordenDoc(id, DB[id]), updated_at: new Date().toISOString() })));
    if (error) throw error;
  } catch (e) { ids.forEach(i => dirty.add(i)); setStatus(navigator.onLine ? "No se pudo guardar: " + (e.message || e) : "Sin conexión · cambios en cola local"); }
  writing = false; saveDirty(); actualizarOffline();
}
function mut(id, fn) {
  const d = id === "global" ? G() : (DB[id] = DB[id] || {});
  fn(d); dirty.add(id); persist(); render(true);
}
function migrate(old) {
  const f = old.fields || {}, wk = ymd(mondayOf(new Date())), mo = curMonth(), b = k => !!f[k];
  DB.global = { water: old.idxAgua || 0, aW: wk, aB: old.idxSemana || 0, aM: mo, aR: old.idxRenta || 0 };
  DB["sem-" + wk] = { basura: b("task-basura"), limpieza: b("task-limpieza") };
  const M = { rent: [0, 1, 2, 3].map(i => b("rentpaid-" + i)), svc: {}, tot: {}, shop: (old.itemsCompras || []).map(x => ({ id: x.id, c: x.concepto, m: x.monto, b: x.comprador, paid: arr(x.paid) })) };
  ["internet", "luz", "agua", "gas"].forEach(k => {
    M.svc[k] = [0, 1, 2, 3].map(i => b(`svc-${k}-${i}`));
    if (k !== "internet") M.tot[k] = parseFloat(f[k + "-total"]) || 0;
  });
  DB["mes-" + mo] = M;
  ["global", "sem-" + wk, "mes-" + mo].forEach(i => dirty.add(i));
}
async function initShared() {
  try {
    if (!window.supabase || SUPABASE_URL.startsWith("PEGA")) { setStatus("Falta configurar Supabase"); return; }
    if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data, error } = await sb.from("estado").select("id,data");
    if (error) throw error;
    const R = {}; let old = null;
    data.forEach(r => {
      if (r.id === "casa") { old = r.data; return; }
      if (r.data && Object.keys(r.data).length) R[r.id] = ordenDoc(r.id, r.data);
    });
    Object.keys(DB).forEach(id => { if (!R[id]) dirty.add(id); });
    for (const id in R) if (!dirty.has(id)) DB[id] = R[id];
    if (!R.global && !DB.global && old && old.fields) migrate(old);
    if (!DB.global) { G(); dirty.add("global"); }
    persist(); render(true);
    if (canal) setStatus("● Compartido en tiempo real");
    else canal = sb.channel("estado-casa")
      .on("postgres_changes", { event: "*", schema: "public", table: "estado" }, p => {
        const r = p.new; if (!r || !r.id || r.id === "casa" || dirty.has(r.id) || !r.data || !Object.keys(r.data).length) return;
        DB[r.id] = ordenDoc(r.id, r.data); try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} render();
      })
      .subscribe(st => {
        if (st === "SUBSCRIBED") setStatus("● Compartido en tiempo real");
        else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT") setStatus("Guarda en la nube, pero sin tiempo real (" + st + ")");
      });
  } catch (e) { if (!canal) sb = null; setStatus(!navigator.onLine ? "Sin conexión · usando la copia de este dispositivo" : "Error: " + ((e && (e.message || e.details)) || String(e))); }
}

/* ---------- Acciones con Notificaciones ---------- */
function switchTab(t) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  $(t).classList.add("active");
  document.querySelectorAll("nav button").forEach(b => {
    const on = b.getAttribute("onclick").includes(`'${t}'`);
    b.classList.toggle("text-indigo-600", on); b.classList.toggle("text-gray-500", !on);

/* ---------- Liquidación estilo Splitwise ---------- */
function calcularLiquidacionMes(compras) {
  const cent = n => Math.round((+n || 0) * 100);
  const saldo = Object.fromEntries(H.map(h => [h, 0]));
  (compras || []).forEach(it => {
    const pagador = it.pagado_por || it.b;
    if (!(pagador in saldo)) return;
    const parts = it.participantes && it.participantes.length ? it.participantes : H;
    const cuota = cent(it.cuota_por_persona != null ? it.cuota_por_persona : (it.monto_total ?? it.m) / parts.length);
    const pagos = arr(it.paid);
    parts.forEach(p => {
      const i = H.indexOf(p);
      if (i < 0 || p === pagador || pagos[i]) return;
      saldo[p] -= cuota; saldo[pagador] += cuota;
    });
  });
  const acreedores = H.filter(h => saldo[h] > 0).map(h => ({ n: h, v: saldo[h] }));
  const deudores = H.filter(h => saldo[h] < 0).map(h => ({ n: h, v: -saldo[h] }));
  const transferencias = [];
  while (acreedores.length && deudores.length) {
    acreedores.sort((a, b) => b.v - a.v); deudores.sort((a, b) => b.v - a.v);
    const c = acreedores[0], d = deudores[0], m = Math.min(c.v, d.v);
    transferencias.push({ de: d.n, a: c.n, monto: m / 100 });
    c.v -= m; d.v -= m;
    if (c.v <= 0) acreedores.shift();
    if (d.v <= 0) deudores.shift();
  }
  return { saldos: Object.fromEntries(H.map(h => [h, saldo[h] / 100])), transferencias };
}

function renderLiquidacion(M) {
  const { saldos, transferencias } = calcularLiquidacionMes(M.shop || []);
  const filas = transferencias.map(t => `<div class="bg-gray-50 rounded-lg p-2.5"><div class="flex justify-between items-center gap-2"><p class="text-sm text-gray-800"><b>${esc(t.de)}</b> → <b>${esc(t.a)}</b></p><span class="text-sm font-black text-rose-700">$${t.monto.toFixed(2)}</span></div>${payInfo(t.a)}</div>`).join("");
  const netos = H.map(h => { const s = saldos[h]; return `<span class="text-xs font-semibold ${s > 0.004 ? "text-green-600" : s < -0.004 ? "text-red-600" : "text-gray-500"}">${esc(h)}: ${s > 0.004 ? "+" : ""}${s.toFixed(2)}</span>`; }).join("");
  $("liquidacion-card").innerHTML = card(`<h2 class="text-lg font-bold text-gray-800 mb-1">Liquidación de ${lblMes(viewMonth)}</h2><p class="text-xs text-gray-500 mb-2">Transferencias mínimas para quedar a mano. Solo cuenta lo que aún no está marcado como pagado.</p>`
    + (filas ? `<div class="space-y-2">${filas}</div><p class="text-xs font-bold text-gray-500 uppercase mt-3 mb-1">Saldo neto (+ le deben · − debe)</p><div class="flex flex-wrap gap-x-3 gap-y-1">${netos}</div>` : `<p class="text-sm font-bold text-green-600">✅ Todos están a mano este mes</p>`));
}

    const p = arr(it.paid), part = it.participantes || H;
    return `<div class="border border-gray-200 rounded-lg p-3"><div class="flex justify-between items-start"><div><p class="font-bold text-gray-800 text-sm">${esc(it.c)}</p><p class="text-xs text-gray-500">A pagar a: ${esc(it.b)} · entre ${part.length}</p>${payInfo(it.b)}</div><span class="text-sm font-black text-rose-700">$${(it.cuota_por_persona ?? it.m / 4).toFixed(2)} c/u</span></div><div class="grid grid-cols-2 gap-2 mt-2">${H.map((h, i) => !part.includes(h) ? "" : `<label class="flex items-center gap-2 bg-gray-50 p-2 rounded text-xs cursor-pointer"><input type="checkbox" ${p[i] ? "checked" : ""} onchange="togPaid(${it.id},${i})" class="h-4 w-4 rounded"><span>${h}</span></label>`).join("")}</div></div>`;
  }).join("") : `<p class="text-sm text-gray-400 text-center py-4">No hay compras registradas en este mes.</p>`;

  $("clear-shop-btn").textContent = armed === "shop" ? "Toca otra vez para confirmar" : "Limpiar lista";
  $("clear-shop-btn").className = "text-xs font-bold " + (armed === "shop" ? "text-white bg-red-600 px-2 py-1 rounded" : "text-rose-600");
  renderLiquidacion(M);
  if (!$("cuentas-card").contains(document.activeElement)) $("cuentas-card").innerHTML = `<details ${cuentasOpen ? "open" : ""} ontoggle="cuentasOpen=this.open" class="bg-white p-4 rounded-xl shadow"><summary class="text-lg font-bold text-gray-800 cursor-pointer">Datos para depósito</summary><p class="text-xs text-gray-500 mt-2">Cada quien escribe su banco y su número de tarjeta o CLABE para recibir depósitos. Cualquiera con acceso a la app puede verlos.</p><div class="space-y-3 mt-3">${H.map((h, i) => { const c = (DB.cuentas || {})[i] || {}; return `<div class="bg-gray-50 rounded-lg p-2.5"><p class="text-sm font-semibold text-gray-800 mb-1.5">${h}</p><input type="text" value="${esc(c.bank || "")}" onchange="setCuenta(${i},'bank',this.value)" class="w-full border border-gray-300 rounded p-2 text-sm mb-1.5" placeholder="Banco"><input type="text" value="${esc(c.ben || "")}" onchange="setCuenta(${i},'ben',this.value)" class="w-full border border-gray-300 rounded p-2 text-sm mb-1.5" placeholder="Beneficiario (titular)"><div class="flex gap-2"><input type="text" inputmode="numeric" value="${esc(c.num || "")}" onchange="setCuenta(${i},'num',this.value)" class="flex-1 min-w-0 border border-gray-300 rounded p-2 text-sm" placeholder="Número de tarjeta o CLABE"><button type="button" onclick="copyNum(${i})" class="bg-indigo-600 text-white text-xs font-bold px-3 rounded">Copiar</button></div></div>`; }).join("")}</div></details>`;
}

/* ---------- Modo oscuro ---------- */
const TEMA_KEY = "tema-casa";
const temaGuardado = () => { try { const t = localStorage.getItem(TEMA_KEY); return t === "dark" || t === "light" ? t : null; } catch (e) { return null; } };
const temaSistema = () => (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function aplicarTema(t) {
  document.documentElement.classList.toggle("dark", t === "dark");
  const b = $("theme-btn");
  if (b) { b.textContent = t === "dark" ? "☀️" : "🌙"; b.setAttribute("aria-label", t === "dark" ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); }
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", t === "dark" ? "#1e293b" : "#4f46e5");
}
function toggleTema() {
  const n = document.documentElement.classList.contains("dark") ? "light" : "dark";
  try { localStorage.setItem(TEMA_KEY, n); } catch (e) {}
  aplicarTema(n);
}
aplicarTema(temaGuardado() || temaSistema());
if (window.matchMedia) {
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const alCambiar = e => { if (!temaGuardado()) aplicarTema(e.matches ? "dark" : "light"); };
  if (mq.addEventListener) mq.addEventListener("change", alCambiar); else if (mq.addListener) mq.addListener(alCambiar);
}

/* ---------- Sin conexión: cambios en cola y envío al volver ---------- */
function actualizarOffline() {
  const bar = $("offline-bar"); if (!bar) return;
  const off = !navigator.onLine;
  bar.classList.toggle("hidden", !off);
  if (off) bar.textContent = `📴 Sin conexión: tus cambios se guardan en este teléfono${dirty.size ? " (" + dirty.size + " en cola)" : ""} y se enviarán al volver internet.`;
}
window.addEventListener("offline", () => { actualizarOffline(); setStatus("Sin conexión · cambios en cola local"); });
window.addEventListener("online", () => {
  actualizarOffline(); setStatus("Reconectando…");
  initShared();
  clearTimeout(timer); timer = setTimeout(flush, 600);
});

/* ---------- Inicio ---------- */
$("compra-pagador").innerHTML = H.map(h => `<option value="${h}">${h}</option>`).join("");
$("compra-part").innerHTML = H.map((h, i) => `<label class="flex items-center gap-2 bg-gray-50 p-2 rounded text-xs cursor-pointer"><input type="checkbox" id="compra-part-${i}" checked class="h-4 w-4 rounded"><span>${h}</span></label>`).join("");
try { DB = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { DB = {}; }
try { JSON.parse(localStorage.getItem(DKEY) || "[]").forEach(id => dirty.add(id)); } catch (e) {}
actualizarOffline();
if (!navigator.onLine) setStatus("Sin conexión · cambios en cola local");
render(true);
initShared();

/* ---------- Vibración háptica ---------- */
const ejecutarVibracion = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
document.addEventListener("click", e => {
  if (e.target.closest('button, nav a, input[type="submit"], input[type="checkbox"], select')) ejecutarVibracion(30);
}, true);

/* ---------- Actualizaciones de la PWA ---------- */
let recargando = false;
function mostrarActualizacion(sw) {
  const t = $("update-toast"); t.classList.remove("hidden"); t.classList.add("flex");
  $("update-btn").onclick = () => {
    ejecutarVibracion(30);
    sw.postMessage({ action: "skipWaiting" });
    setTimeout(() => { if (!recargando) { recargando = true; location.reload(); } }, 1200);
  };
}
function iniciarSW() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (recargando) return; recargando = true; location.reload(); });
  navigator.serviceWorker.register("sw.js").then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) mostrarActualizacion(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const nuevo = reg.installing; if (!nuevo) return;
      nuevo.addEventListener("statechange", () => { if (nuevo.state === "installed" && navigator.serviceWorker.controller) mostrarActualizacion(nuevo); });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
}
window.addEventListener("load", iniciarSW);

/* ---------- Deslizar para actualizar ---------- */
(function () {
  const ptr = $("ptr"), txt = $("ptr-t"), UMBRAL = 70;
  let y0 = null, dy = 0;
  const reset = () => { ptr.style.transform = "translateY(-20px)"; ptr.style.opacity = 0; txt.textContent = "↓ Desliza para actualizar"; y0 = null; dy = 0; };
  document.addEventListener("touchstart", e => {
    y0 = (window.scrollY > 0 || e.target.closest("input, select, textarea")) ? null : e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0) { reset(); return; }
    ptr.style.opacity = Math.min(1, dy / UMBRAL);
    ptr.style.transform = `translateY(${Math.min(dy * 0.4, 36)}px)`;
    txt.textContent = dy > UMBRAL ? "↑ Suelta para actualizar" : "↓ Desliza para actualizar";
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (y0 !== null && dy > UMBRAL) { ejecutarVibracion(40); txt.textContent = "Actualizando…"; setTimeout(() => location.reload(), 150); }
    else reset();
  }, { passive: true });
})();

/* ---------- Manejo de PWA Shortcuts ---------- */
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const action = params.get("shortcut");

  if (!action) return;

  window.history.replaceState({}, document.title, window.location.pathname);

  setTimeout(() => {
    if (action === "compra") {
      switchTab("compras");
      const input = $("shop-concept");
      if (input) {
        input.focus();
        input.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    } else if (action === "garrafon") {
      switchTab("turnos");
      garr("uso");
      toast("💧 Garrafón descontado");
    } else if (action === "basura") {
      switchTab("turnos");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (action === "cuentas") {
      cuentasOpen = true;
      switchTab("compras");
      render(true);
      const card = $("cuentas-card");
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
  }, 400);
});
</script>
